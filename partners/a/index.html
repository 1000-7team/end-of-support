<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1000-7team | Личный кабинет</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);min-height:100vh}
        .cabinet-header{background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);padding:15px 30px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
        .logo{font-size:24px;font-weight:bold;color:#fff}
        .logo span{color:#e94560}
        .user-info{display:flex;align-items:center;gap:20px;background:rgba(255,255,255,0.2);padding:8px 20px;border-radius:50px;color:#fff}
        .user-info .role{background:#e94560;padding:4px 12px;border-radius:20px;font-size:12px}
        .logout-btn{background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:8px 20px;border-radius:25px;cursor:pointer}
        .cabinet-content{padding:30px;max-width:1200px;margin:0 auto}
        .welcome-card{background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border-radius:20px;padding:30px;margin-bottom:30px;color:#fff}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-bottom:30px}
        .stat-card{background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border-radius:15px;padding:25px;text-align:center;color:#fff}
        .stat-card .number{font-size:36px;font-weight:bold;color:#e94560;margin-bottom:10px}
        .info-panel{background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border-radius:20px;padding:25px;color:#fff}
        .info-panel h3{margin-bottom:20px;padding-bottom:10px;border-bottom:2px solid rgba(255,255,255,0.2)}
        .info-row{display:flex;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.1)}
        .info-row .label{width:150px;font-weight:bold;opacity:0.8}
        .info-row .value{flex:1}
        .role-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px}
        .role-admin{background:#f39c12;color:#333}
        .role-partner{background:#2ecc71;color:#fff}
        .role-manager{background:#3498db;color:#fff}
        @media (max-width:768px){.cabinet-header{flex-direction:column}.info-row{flex-direction:column}.info-row .label{width:auto}}
    </style>
</head>
<body>
    <div class="cabinet-header">
        <div class="logo">1000-7<span>team</span></div>
        <div class="user-info">
            <span id="userName"></span>
            <span id="userRole" class="role"></span>
        </div>
        <button class="logout-btn" onclick="doLogout()">Выйти</button>
    </div>
    <div class="cabinet-content">
        <div class="welcome-card">
            <h2>Добро пожаловать, <span id="welcomeName"></span>!</h2>
            <p>Вы вошли в партнерский кабинет 1000-7team</p>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><div class="number" id="statOrgCount">-</div><div class="label">Организация</div></div>
            <div class="stat-card"><div class="number" id="statRole">-</div><div class="label">Роль</div></div>
            <div class="stat-card"><div class="number" id="statTotalPartners">-</div><div class="label">Партнеров в организации</div></div>
        </div>
        <div class="info-panel">
            <h3>Информация об аккаунте</h3>
            <div class="info-row"><div class="label">Организация:</div><div class="value" id="infoOrg"></div></div>
            <div class="info-row"><div class="label">Логин:</div><div class="value" id="infoLogin"></div></div>
            <div class="info-row"><div class="label">Роль:</div><div class="value" id="infoRole"></div></div>
        </div>
    </div>

    <script>
        let usersDatabase = [];
        let currentUser = null;

        async function loadUsers() {
            try {
                const response = await fetch('/partners/users.txt');
                const text = await response.text();
                const lines = text.split('\n');
                for (let line of lines) {
                    line = line.trim();
                    if (line === '' || line.startsWith('#')) continue;
                    const parts = line.split(':');
                    if (parts.length >= 4) {
                        usersDatabase.push({
                            organization: parts[0],
                            login: parts[1],
                            role: parts[2],
                            password: parts[3]
                        });
                    }
                }
            } catch(e) {
                usersDatabase = [
                    { organization: "ООО Ромашка", login: "ivanov", role: "admin", password: "12345" },
                    { organization: "ООО Ромашка", login: "petrov", role: "partner", password: "12345" }
                ];
            }
        }

        function checkAuth() {
            const savedUser = localStorage.getItem('currentUser');
            if (!savedUser) {
                window.location.href = '/partners/login/ic/ufs/';
                return;
            }
            try {
                currentUser = JSON.parse(savedUser);
                const exists = usersDatabase.find(u => u.login === currentUser.login);
                if (!exists) {
                    localStorage.removeItem('currentUser');
                    window.location.href = '/partners/login/ic/ufs/';
                    return;
                }
                showCabinet();
            } catch(e) {
                window.location.href = '/partners/login/ic/ufs/';
            }
        }

        function showCabinet() {
            document.getElementById('userName').textContent = currentUser.login;
            document.getElementById('welcomeName').textContent = currentUser.login;
            document.getElementById('infoOrg').textContent = currentUser.organization;
            document.getElementById('infoLogin').textContent = currentUser.login;
            
            const roleSpan = document.getElementById('userRole');
            roleSpan.textContent = currentUser.role;
            roleSpan.className = `role role-${currentUser.role}`;
            
            document.getElementById('infoRole').innerHTML = `<span class="role-badge role-${currentUser.role}">${currentUser.role}</span>`;
            document.getElementById('statOrgCount').textContent = currentUser.organization;
            document.getElementById('statRole').textContent = currentUser.role;
            
            const partnersInOrg = usersDatabase.filter(u => u.organization === currentUser.organization);
            document.getElementById('statTotalPartners').textContent = partnersInOrg.length;
        }

        function doLogout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/partners/login/ic/ufs/';
        }

        loadUsers().then(() => {
            checkAuth();
        });
    </script>
</body>
</html>
